name: late_pleistocene_vole_project
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python
  - python=3.10
  
  # Preprocessing
  - fastp=0.23.4
  - adapterremoval=2.3.2
  
  # Taxonomic classification
  - kraken2=2.1.3
  - seqkit=2.5.1
  
  # Mapping & SAM/BAM processing
  - bwa=0.7.17
  - samtools=1.19
  - bcftools=1.19
  - picard=3.1.0
  
  # Ancient DNA damage
  - mapdamage=2.2.1
  
  # De novo assembly
  - mitoz=3.0.4
  - megahit=1.2.9
  
  # Phylogenetics
  - mafft=7.525
  - iqtree=2.3.2
  - clipkit=1.2.0
  
  # Bayesian dating
  - beast2=2.7.7
  - tracers=1.7.2
  
  # Visualization
  - r-base=4.3
  - r-ggtree=3.10.0
  - r-ape=5.7
  
  # Utilities
  - wget
  - gzip
  
  # Pip (for packages not in conda)
  - pip
  - pip:
    - biopython>=1.81